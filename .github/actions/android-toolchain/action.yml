# What a build of the APK needs, the same for ci.yml and release.yml: a JDK
# and Gradle for the Android Gradle Plugin. The Android SDK (platform 36,
# build-tools) is the runner image's; the Android Gradle Plugin fetches a
# missing platform or build-tools by itself (the image's licences are
# accepted).
name: Android toolchain
description: JDK 17 and Gradle

inputs:
  gradle-version:
    description: The Gradle release that runs the build
    default: "8.14.6"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: ${{ inputs.gradle-version }}
        cache-disabled: true
    - name: The SDK
      shell: bash
      run: |
        test -n "$ANDROID_HOME" || { echo "::error::ANDROID_HOME is not set"; exit 1; }
        ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
